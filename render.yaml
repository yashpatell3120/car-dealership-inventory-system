services:
  - type: web
    name: car-dealership-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node --experimental-sqlite dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: DB_PATH
        value: /var/data/dealership.sqlite
      - key: PORT
        value: 4000
    disk:
      name: dealership-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: car-dealership-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
